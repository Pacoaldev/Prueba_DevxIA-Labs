version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: translog-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: translog_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d translog_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: translog-api
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/translog_db?schema=public"
      JWT_SECRET: "super-secret-key-change-in-prod"
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: translog-web
    restart: always
    ports:
      - '4200:80'
    depends_on:
      - api

volumes:
  postgres_data:
